<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Cantantes</title>
  <meta name="description" content="Directorio de cantantes con acceso directo a YouTube.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Light Blobs -->
  <div class="bg-ambient">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">

    <!-- Header Section -->
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon">🎤</div>
          <div class="brand-info">
            <h1>Cantantes</h1>
            <p>Directorio de cantantes y acceso directo a YouTube</p>
          </div>
        </div>

        <div class="header-actions">
          <div class="stat-pill" id="statPill">
            <span id="totalSingers">0</span> Cantantes
          </div>
        </div>
      </div>

      <!-- Controls & Search -->
      <div class="controls-card">
        <div class="search-row">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar cantante..." autocomplete="off">
            <button id="searchClear" class="search-clear" title="Limpiar búsqueda">&times;</button>
          </div>

          <select id="artistSelect" class="select-filter">
            <option value="">Todos los Cantantes</option>
          </select>
        </div>

        <!-- Alphabetical Quick Nav Bar -->
        <div class="alphabet-bar" id="alphabetBar">
          <!-- Populated by app.js -->
        </div>
      </div>
    </header>

    <!-- Main Table Container -->
    <main class="table-container">
      <div class="table-header">
        <div class="th-cell active-sort" id="thSinger">
          <span>Cantante</span>
          <span class="sort-icon">▲</span>
        </div>
        <div class="th-cell actions-th">
          <span>Acciones</span>
        </div>
      </div>

      <!-- Table Body Rows -->
      <div class="table-body" id="singersBody">
        <!-- Rendered dynamically by app.js -->
      </div>
    </main>

  </div>

  <!-- Bottom Player / Quick Bar -->
  <div class="player-bar" id="playerBar">
    <div class="player-info">
      <div class="equalizer">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
      <div class="player-details">
        <div class="player-singer-title" id="playerSingerTitle">Cantante Seleccionado</div>
        <div class="player-singer" id="playerSinger">Nombre del cantante</div>
      </div>
    </div>

    <div class="player-controls">
      <a href="#" target="_blank" rel="noopener noreferrer" class="external-link-btn link-youtube" id="linkYoutube" title="Buscar en YouTube">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        Ver en YouTube
      </a>
      <button class="close-player" id="closePlayer" title="Cerrar">&times;</button>
    </div>
  </div>

  <!-- Data Script -->
  <script src="cantantes.js"></script>
  <!-- Application Script -->
  <script src="app.js"></script>
</body>
</html>
